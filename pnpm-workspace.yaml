packages:
  - 'packages/*'

allowBuilds:
  esbuild: true
  unrs-resolver: true
onlyBuiltDependencies:
  - esbuild

catalog:
  # Types
  '@types/node': ^26.3.0

  # ESLint
  '@eslint/js': ^10.0.1
  eslint: ^10.9.1
  eslint-config-prettier: ^10.1.8
  typescript-eslint: ^8.68.0

  # Tooling
  jiti: ^2.7.0 # lets ESLint load the TypeScript flat config
  prettier: ^3.9.6
  tsdown: ^0.22.14
  typescript: ^6.0.3

  # Testing
  vitest: ^4.1.11
